<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You're In! | Breakthrough Author Live</title>
<link rel="stylesheet" href="style.css">
<style>
  body { padding-bottom: var(--space-6); display: flex; align-items: center; min-height: 100vh; }
  .ty-wrap { max-width: 560px; margin: 0 auto; padding: var(--space-4) var(--space-3); text-align: center; }
  .check-circle {
    width: 72px; height: 72px; border-radius: 50%; background: var(--color-primary);
    color: #fff; display: flex; align-items: center; justify-content: center; margin: 0 auto var(--space-3);
  }
</style>
</head>
<body>
<div class="ty-wrap">
  <div class="check-circle">
    <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 13l4 4L19 7"/></svg>
  </div>
  <h1>You're In, <span id="ty-name">Coach</span>!</h1>
  <p>Welcome to Breakthrough Author Live. Check your email for your login details and Week 1 kickoff instructions.</p>
  <p id="ty-oto-msg" style="display:none;color:var(--color-muted-foreground);"></p>
  <a href="index.html" class="btn btn-primary" style="margin-top:var(--space-3);">Back to Home</a>
</div>

<script>
  var order = JSON.parse(localStorage.getItem('bal_order') || 'null');
  if (order && order.name) {
    document.getElementById('ty-name').textContent = order.name.split(' ')[0];
  }
  var params = new URLSearchParams(window.location.search);
  var otoMsg = document.getElementById('ty-oto-msg');
  if (params.get('oto') === 'yes') {
    otoMsg.textContent = 'Your Bestseller Launch Accelerator has been added — our team will reach out with next steps.';
    otoMsg.style.display = 'block';
  } else if (params.get('oto') === 'no') {
    otoMsg.textContent = 'No worries — you can add the Launch Accelerator later from inside the Mastermind.';
    otoMsg.style.display = 'block';
  }
  console.log('[pixel] Purchase confirmed (placeholder)');
</script>
</body>
</html>
